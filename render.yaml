services:
  - type: web
    name: bot-studio-panel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ALLOWED_USER_IDS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: AUTOMATION_SECRET
        sync: false
      - key: SOCIAL_POST_CHANNEL_ID
        sync: false
