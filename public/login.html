<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log In - Bot Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <div class="brand-mark">BS</div>
      <h1>Bot Studio</h1>
      <p>Log in with Discord to manage your server message scripts.</p>
      <a class="login-button" href="/auth/discord">Log in with Discord</a>
      <p class="login-meta" id="setupHint"></p>
    </main>

    <script>
      const hint = document.querySelector("#setupHint");
      if (new URLSearchParams(location.search).get("setup") === "missing") {
        hint.textContent =
          "Discord login is not configured yet. Add DISCORD_CLIENT_ID and DISCORD_CLIENT_SECRET to .env.";
      }
    </script>
  </body>
</html>
